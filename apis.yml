description: Rovilus is a seed-stage hardware startup founded in 2018 by YenChe Huang
  and Katherine Kan, developing thermal management technology for industrial battery
  packs. The company raised roughly $150K from 500 Global (formerly 500 Startups)
  and appears in that firm's portfolio. It was surfaced as a portfolio company of
  500-global and added to the API Evangelist network as an enrichment lead. As of
  this enrichment pass the company's website (rovilus.com) no longer resolves (NXDOMAIN,
  no NS/MX records), and no public API, developer portal, SDK, documentation, or other
  developer surface could be found; Rovilus is a physical battery-thermal hardware
  company with no API footprint.
